<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Live NFL Analytics</title><style>body{background:#0c1424;color:#e7effb;font:15px system-ui;margin:0}main{max-width:1500px;margin:auto;padding:22px}h1{margin-bottom:5px}h2{color:#6fe0cb}button,input,select{background:#192d46;color:inherit;border:1px solid #47617b;border-radius:7px;padding:12px;margin:5px}button{cursor:pointer}nav{display:flex;flex-wrap:wrap}.box{padding:18px;background:#18283e;border-radius:10px;margin:18px 0;line-height:1.6}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}td,th{padding:12px;border-bottom:1px solid #2b405a;text-align:left}th{color:#8fcef2;cursor:pointer}p{line-height:1.6}a{color:#6fe0cb}</style><main><h1>Live NFL Analytics</h1><p>Real published nflverse data · automatic scheduled updates · independent project</p><div id="status" class="box">Loading real NFL data…</div><nav id="nav"></nav><p><input id="search" placeholder="Search team or player" aria-label="Search"><select id="week" aria-label="Week"><option value="">All weeks</option></select></p><section id="view"></section></main><script>
let d,tab='Teams',key=null,asc=false;const $=x=>document.getElementById(x),esc=x=>String(x??'Unavailable').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function table(rows,cols){if(key)rows.sort((a,b)=>a[key]==null?1:b[key]==null?-1:(typeof a[key]==='number'?a[key]-b[key]:String(a[key]).localeCompare(String(b[key])))*(asc?1:-1));return '<div class="scroll"><table><thead><tr>'+cols.map(c=>'<th data-key="'+c+'">'+esc(c.replaceAll('_',' '))+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+cols.map(c=>'<td>'+esc(typeof r[c]==='number'&&!Number.isInteger(r[c])?r[c].toFixed(3):r[c])+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
function render(){const q=$('search').value.toLowerCase(),w=$('week').value;let content='';$('nav').innerHTML=['Teams','Players','Matchups','QB Risk','Sources & Model'].map(x=>'<button data-tab="'+x+'">'+x+'</button>').join('');
if(tab==='Teams')content='<p>EPA/play: higher is better for offense, lower for defense. Success = EPA &gt; 0. Explosive = pass gain ≥20 or run gain ≥10 yards. Rates are fractions (0.450 = 45%).</p>'+table(d.teams.filter(r=>r.team.toLowerCase().includes(q)),['team','off_plays','off_epa','def_epa','net_epa','off_success','def_success','off_explosive','def_explosive','off_pass_epa','off_run_epa','def_pass_epa','def_run_epa','off_yards_per_play','def_yards_per_play']);
if(tab==='Players'||tab==='QB Risk'){let rows=d.players.filter(r=>(tab!=='QB Risk'||r.role==='passer')&&(!w||r.week==w)&&(r.player+' '+r.team).toLowerCase().includes(q));content='<p>Weekly play-by-play-derived statistics, not certified box scores. Separate rows for passing, rushing and receiving. Missing fields remain unavailable. Kneels and spikes excluded.</p>'+table(rows,tab==='QB Risk'?['player','team','week','epa','cpoe','air_yards','sack_rate','interception_rate']:['player','team','week','role','attempts','completions','passing_yards','passing_tds','interceptions','sacks','carries','rushing_yards','rushing_tds','targets','receptions','receiving_yards','receiving_tds']);if(tab==='QB Risk')content+='<div class="box">Pressure rate, turnover-worthy-play rate, big-time-throw rate and time to throw: Unavailable — no charting provider configured. EPA and CPOE measure performance, not directly risky decisions. Sack rate is per attributed passer play; interception rate is per recorded attempt. Attribution may be incomplete.</div>';}
if(tab==='Matchups')content='<p>Upcoming games; margin is home minus away. Probabilities are uncalibrated model outputs, not proven betting forecasts. In-progress games may appear until final scores are published.</p>'+table(d.games.filter(r=>(!w||r.week==w)&&(r.home+' '+r.away).toLowerCase().includes(q)),['date','week','away','home','home_offense_vs_defense_epa','away_offense_vs_defense_epa','home_margin','home_win_probability','status']);
if(tab==='Sources & Model')content='<div class="box">Refresh: hourly on GitHub, independent of your browser. Open pages check for new snapshots every five minutes. This is not a guaranteed real-time game feed. New downloads do not guarantee new upstream plays.<p>Latest game date: '+esc(d.latest_game_date)+'; latest week: '+d.latest_week+'. Failed refreshes retain the previous published site.</p></div><h3>Prediction model</h3><p>Offensive and defensive EPA are shrunk toward league EPA using a 200-play prior. Expected EPA/play = shrunk offense + opponent shrunk EPA allowed − league EPA. Margin = 60 × (home expected EPA − away expected EPA) + 1.5 home points (zero at neutral sites). Home-win probability = logistic(margin/7). Requires 50 offensive and defensive EPA observations per team.</p><p>Constants are assumptions, not trained coefficients. No backtested accuracy is claimed. No injuries, lineup changes, weather, rest or opponent-adjusted ratings are modeled. Eligible plays are passes/runs excluding kneels, spikes, no-plays and special teams. EPA rates exclude missing EPA.</p><h3>Actual download sources</h3>'+d.sources.map(s=>'<div class="box"><a target="_blank" rel="noopener" href="'+esc(s.url)+'">'+esc(s.url)+'</a><p>Retrieved: '+esc(s.retrieved)+'<br>Upstream modified: '+esc(s.modified)+'</p></div>').join('');
$('view').innerHTML='<h2>'+tab+'</h2>'+content;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;key=null;render()});document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{asc=key===b.dataset.key?!asc:false;key=b.dataset.key;render()});}
async function load(){try{let r=await fetch('data.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('No successful real-data publication yet (HTTP '+r.status+')');d=await r.json();$('status').textContent='REAL DATA · '+d.season+' season · latest week '+d.latest_week+' · published '+new Date(d.published).toLocaleString()+(Date.now()-Date.parse(d.published)>10800000?' · WARNING: publication is over 3 hours old':'');let previous=$('week').value;$('week').innerHTML='<option value="">All weeks</option>'+[...new Set([...d.players,...d.games].map(r=>r.week))].sort((a,b)=>a-b).map(w=>'<option>'+w+'</option>').join('');$('week').value=previous;render();}catch(e){$('status').textContent=e.message+'. Check GitHub Actions → Publish live NFL site. No demo data is used.'}}$('search').oninput=render;$('week').onchange=render;load();setInterval(load,300000);
</script></html>
